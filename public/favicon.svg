<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="blueGradient" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="smoothShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Irregular organic fluid shape representing '屿' (Island/Pebble) -->
  <path
    d="M 28 20 C 48 10, 78 15, 85 35 C 92 55, 88 78, 68 88 C 48 98, 20 85, 14 62 C 8 39, 12 25, 28 20 Z"
    fill="url(#blueGradient)"
    filter="url(#smoothShadow)"
  />

  <!-- Layered white organic curve representing abstract dynamic sea waves and the number '11' -->
  <path
    d="M 32 45 C 36 32, 44 26, 48 34 C 51 40, 48 64, 48 70"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <path
    d="M 52 41 C 56 28, 64 22, 68 30 C 71 36, 68 60, 68 66"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Delicate floating white splash dot symbolizing optimism and freshness -->
  <circle cx="76" cy="24" r="3.5" fill="#FFFFFF" />
  <circle cx="21" cy="74" r="2.5" fill="#FFFFFF" opacity="0.8" />
</svg>
